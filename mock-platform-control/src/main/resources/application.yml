server:
  port: ${MOCK_CONTROL_PORT:19090}

spring:
  application:
    name: mock-platform-control
  datasource:
    url: ${MOCK_MYSQL_URL}
    username: ${MOCK_MYSQL_USERNAME}
    password: ${MOCK_MYSQL_PASSWORD}
  data:
    redis:
      host: ${MOCK_REDIS_HOST:localhost}
      port: ${MOCK_REDIS_PORT:6379}
  flyway:
    enabled: ${MOCK_FLYWAY_ENABLED:true}
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
